name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.30.3

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Validate release version
        run: |
          package_version="$(node -p "require('./package.json').version")"
          if [ "v${package_version}" != "$GITHUB_REF_NAME" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match package version v${package_version}." >&2
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify source
        run: |
          pnpm format:check
          pnpm hygiene:artifacts
          pnpm check:imports
          pnpm lint
          pnpm typecheck
          pnpm test

      - name: Build Next.js
        env:
          DEPLOYMENT_MODE: hosted
        run: pnpm build

      - name: Build Cloudflare Worker
        env:
          DEPLOYMENT_MODE: hosted
        run: pnpm build:worker

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level moderate

  github-release:
    needs: verify-release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract release notes
        run: |
          node .github/scripts/extract-release-notes.mjs \
            "$GITHUB_REF_NAME" \
            CHANGELOG.md \
            "$RUNNER_TEMP/release-notes.md"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" \
              --title "$tag" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$tag" \
              --title "$tag" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --verify-tag
          fi
